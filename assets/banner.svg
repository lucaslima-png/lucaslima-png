<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#14062b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Courier New', monospace; }
      .boot { font-size: 14px; fill: #00f0ff; opacity: 0; }
      .b1 { animation: show 0.3s 0.3s forwards; }
      .b2 { animation: show 0.3s 0.9s forwards; }
      .b3 { animation: show 0.3s 1.5s forwards; }
      .b4 { animation: show 0.3s 2.1s forwards; }
      .title { font-size: 66px; font-weight: bold; fill: url(#neon); opacity: 0; animation: show 0.8s 2.8s forwards; }
      .sub { font-size: 20px; fill: #9fb4ff; letter-spacing: 6px; opacity: 0; animation: show 0.8s 3.4s forwards; }
      .bar { transform-origin: left; transform: scaleX(0); animation: load 2.2s 0.3s forwards; }
      .scan { animation: scan 4s linear infinite; }
      .ring { transform-origin: 1040px 160px; animation: spin 14s linear infinite; }
      .ring2 { transform-origin: 1040px 160px; animation: spin 9s linear infinite reverse; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes load { to { transform: scaleX(1); } }
      @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(340px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.6" stroke-width="2"/>

  <!-- boot sequence -->
  <text x="40" y="50" class="boot b1">&gt; INICIALIZANDO SISTEMA...</text>
  <text x="40" y="76" class="boot b2">&gt; CARREGANDO MODULO JAVA ........ [OK]</text>
  <text x="40" y="102" class="boot b3">&gt; CONECTANDO AO GITHUB .......... [OK]</text>
  <text x="40" y="128" class="boot b4">&gt; PERFIL ONLINE.</text>

  <rect x="40" y="144" width="320" height="6" rx="3" fill="#00f0ff" fill-opacity="0.15"/>
  <rect x="40" y="144" width="320" height="6" rx="3" fill="url(#neon)" class="bar" filter="url(#glow)"/>

  <!-- title -->
  <text x="40" y="228" class="title" filter="url(#glow)">LUCAS DEV</text>
  <text x="42" y="268" class="sub">JAVA DEVELOPER  //  EM EVOLUCAO</text>

  <!-- HUD ring -->
  <g fill="none" stroke-linecap="round">
    <circle cx="1040" cy="160" r="92" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="2"/>
    <circle class="ring" cx="1040" cy="160" r="80" stroke="#00f0ff" stroke-width="3" stroke-dasharray="60 30 10 30" filter="url(#glow)"/>
    <circle class="ring2" cx="1040" cy="160" r="60" stroke="#b026ff" stroke-width="3" stroke-dasharray="20 18" filter="url(#glow)"/>
    <circle class="pulse" cx="1040" cy="160" r="26" fill="#00f0ff" fill-opacity="0.25" stroke="#00f0ff" stroke-width="2"/>
  </g>
  <text x="1018" y="166" font-size="16" fill="#00f0ff" class="pulse">&lt;/&gt;</text>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" fill-opacity="0.18"/>
</svg>
